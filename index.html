<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendaftaran Event</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7280; --accent:#4f46e5; --ok:#16a34a; --err:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:20px; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:16px;
          padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .badge { display:inline-block; background:#eef2ff; color:var(--accent); font-size:12px;
           font-weight:600; padding:4px 10px; border-radius:999px; margin-bottom:12px; }
  h1 { margin:0 0 6px; font-size:22px; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  input { width:100%; padding:13px 14px; font-size:16px; border:1.5px solid #d1d5db;
          border-radius:10px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #e0e7ff; }
  button { width:100%; margin-top:16px; padding:14px; font-size:16px; font-weight:600;
           color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .msg { margin-top:14px; font-size:14px; min-height:20px; color:var(--err); }
  .done { text-align:center; display:none; }
  .done .check { font-size:48px; color:var(--ok); }
  .done a { color:var(--accent); font-size:14px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div class="card">

  <div id="formView">
    <span class="badge">GRATIS</span>
    <h1>Daftar Kehadiran</h1>
    <p class="sub">Isi nama dan instansi kamu lalu tekan kirim.</p>

    <label for="nama">Nama lengkap</label>
    <input id="nama" type="text" placeholder="Contoh: Budi Santoso" autocomplete="name" maxlength="80">

    <label for="instansi" style="margin-top:14px">Instansi</label>
    <input id="instansi" type="text" placeholder="Contoh: Universitas Gadjah Mada" autocomplete="organization" maxlength="100">
    <button id="btn" type="button">Kirim</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="done" id="doneView">
    <div class="check">✓</div>
    <h1>Terima kasih!</h1>
    <p class="sub">Kehadiran kamu sudah tercatat.</p>
    <a id="again">Daftarkan orang lain</a>
  </div>

</div>

<script>
  // GANTI dengan URL Web App dari Google Apps Script kamu
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlNb17v4gy51GLKpcVlzXClH1he2ICkY6neoa_s8yo4eMjzsRzRXT313XRwzh4h6odPA/exec";

  const $ = id => document.getElementById(id);
  const input = $("nama"), instansiInput = $("instansi"), btn = $("btn"), msg = $("msg");

  async function kirim() {
    const nama = input.value.trim();
    msg.textContent = "";
    const instansi = instansiInput.value.trim();
    if (nama.length < 2) { msg.textContent = "Nama wajib diisi."; return; }
    if (instansi.length < 2) { msg.textContent = "Instansi wajib diisi."; return; }
    if (SCRIPT_URL.startsWith("PASTE")) { msg.textContent = "URL Apps Script belum diisi di kode."; return; }

    btn.disabled = true; btn.textContent = "Mengirim...";
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: new URLSearchParams({ nama, instansi })
      });
      $("formView").style.display = "none";
      $("doneView").style.display = "block";
    } catch (e) {
      msg.textContent = "Gagal mengirim. Cek koneksi lalu coba lagi.";
    } finally {
      btn.disabled = false; btn.textContent = "Kirim";
    }
  }

  btn.addEventListener("click", kirim);
  input.addEventListener("keydown", e => { if (e.key === "Enter") instansiInput.focus(); });
  instansiInput.addEventListener("keydown", e => { if (e.key === "Enter") kirim(); });
  $("again").addEventListener("click", () => {
    input.value = "";
    instansiInput.value = "";
    $("doneView").style.display = "none";
    $("formView").style.display = "block";
    input.focus();
  });
</script>
</body>
</html>
